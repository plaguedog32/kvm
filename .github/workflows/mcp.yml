name: MCP firmware
on:
  pull_request:
    paths: ["internal/localonly/**", "internal/timesync/**", "internal/guestbridge/**", "internal/usbgadget/**", "cmd/jetkvm-guest/**", "internal/guestassets/**", "internal/mcpserver/**", "internal/videoimage/**", "internal/native/cgo/snapshot.*", "internal/native/tests/**", ".github/workflows/mcp.yml"]
  push:
    paths: ["internal/localonly/**", "internal/timesync/**", "internal/guestbridge/**", "internal/usbgadget/**", "cmd/jetkvm-guest/**", "internal/guestassets/**", "internal/mcpserver/**", "internal/videoimage/**", "internal/native/cgo/snapshot.*", "internal/native/tests/**", ".github/workflows/mcp.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: go test -race ./internal/localonly ./internal/timesync ./internal/mcpserver ./internal/videoimage ./internal/guestbridge ./internal/usbgadget
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/jetkvm-guest
      - run: |
          cc -std=c11 -Wall -Wextra -Werror -pthread -Iinternal/native/cgo internal/native/tests/snapshot_test.c internal/native/cgo/snapshot.c -o /tmp/jetkvm-snapshot-test
          /tmp/jetkvm-snapshot-test
